backend:
  name: github
  repo: theeeperspective-beep/theeeperspective-beep.github.io
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "reports"
    label: "Engineering Reports"
    folder: "_reports"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Report Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Author Name", name: "author", widget: "string" }
      - { label: "Upload Official PDF", name: "pdf_file", widget: "file", required: false }
      - { label: "Report Text Content", name: "body", widget: "markdown" }
